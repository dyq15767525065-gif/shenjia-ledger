<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FCFCFD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="身家账本">
<meta name="description" content="身家账本——每天记好账，看清每个账户，随时知道自己的身家。数据仅存本机。">
<title>身家账本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
<main id="main"></main>
  <nav id="tabbar">
    <button class="tab active" data-act="tab" data-id="home" data-tab="home"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.8 9.6v10.9h12.4V9.6"/><path d="M10 20.5V15h4v5.5"/></svg></span><span class="tab-tx">总览</span></button>
    <button class="tab" data-act="tab" data-id="ledger" data-tab="ledger"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg></span><span class="tab-tx">明细</span></button>
    <button id="fab" aria-label="记一笔"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5.2v13.6M5.2 12h13.6"/></svg></button>
    <button class="tab" data-act="tab" data-id="accounts" data-tab="accounts"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="12" rx="2.5"/><path d="M3 10.8h18"/><circle cx="16.8" cy="14.8" r=".95" fill="currentColor" stroke="none"/></svg></span><span class="tab-tx">账户</span></button>
    <button class="tab" data-act="tab" data-id="me" data-tab="me"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.6"/><path d="M4.9 20a7.1 7.1 0 0 1 14.2 0"/></svg></span><span class="tab-tx">我的</span></button>
  </nav>
  <div id="sheet-mask" class="hidden"></div>
  <section id="sheet" class="hidden" role="dialog" aria-modal="true"></section>
  <div id="toast" class="hidden"><span id="toast-msg"></span><button id="toast-btn" class="hidden"></button></div>
  <input type="file" id="file-import" accept=".json,application/json" class="hidden">
  <input type="file" id="file-bill" accept=".csv,text/csv" class="hidden">
</div>
<script src="app.js"></script>
</body>
</html>
